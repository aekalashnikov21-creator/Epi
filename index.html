<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epilate-Me · Маркетинг-стратегия 2026–2027</title>
    <meta
      name="description"
      content="Маркетинг-стратегия сети клиник лазерной эпиляции Epilate-Me: медиаплан 281 000 ₽/мес, юнит-экономика, ROMI +663%, дорожная карта на 12 месяцев."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231B3A5C'/%3E%3Cpath d='M12 4l1.9 6.1L20 12l-6.1 1.9L12 20l-1.9-6.1L4 12l6.1-1.9z' fill='%23D4AF37'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700;800&family=Golos+Text:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body style="margin: 0; background: #f1f5fa">
    <div id="root"></div>
    <noscript>
      <div style="max-width: 560px; margin: 12vh auto; padding: 32px; font-family: 'Segoe UI', system-ui, sans-serif; color: #10233a; border: 1px solid #d4af37; background: #fff">
        <p style="margin: 0 0 8px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #b08f26">
          Epilate-Me · Стратегия 2026–2027
        </p>
        <p style="margin: 0; line-height: 1.6">
          Для просмотра интерактивной версии стратегии включите JavaScript в браузере.
        </p>
      </div>
    </noscript>
    <script>
      // Перехват ошибок ДО загрузки модуля приложения.
      // Если модуль упадёт на импорте или среда его заблокирует —
      // показываем причину вместо пустого экрана.
      (function () {
        var errors = [];
        window.addEventListener("error", function (e) {
          errors.push((e.message || "error") + " @" + (e.filename || "?") + ":" + (e.lineno || "?"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          errors.push(String(e.reason));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root) return;
          if (!root.querySelector("[data-app-mounted]") && root.children.length === 0) {
            root.innerHTML =
              '<div style="max-width:640px;margin:10vh auto;padding:32px;font-family:\'Segoe UI\',system-ui,sans-serif;color:#10233a;border:1px solid #c64b3c;background:#fff">' +
              '<p style="margin:0 0 10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a93b2e;font-size:13px">Не удалось запустить страницу</p>' +
              '<p style="margin:0 0 12px;line-height:1.6;font-size:14px">Интерактивная стратегия Epilate-Me не запустилась. Обновите страницу или откройте файл в современном браузере.</p>' +
              '<p style="margin:0;line-height:1.5;font-size:12px;color:#666;word-break:break-word">' +
              (errors.length ? errors.join("; ").replace(/</g, "&lt;") : "Скрипт не был исполнен — среда может блокировать скрипты.") +
              "</p></div>";
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
